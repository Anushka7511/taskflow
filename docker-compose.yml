# Start:  docker compose up --build
# Tests:  docker compose --profile test run --rm tests
# Stop:   docker compose down          (add -v to also delete the database volume)

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}   # development default; override via .env
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - pgdata:/var/lib/postgresql/data                   # named volume: data survives container re-creation
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"                 # bound to localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy                        # API starts only once PostgreSQL accepts connections
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      # Development placeholder so `docker compose up --build` works out of the box.
      # The app REFUSES to start with it when ENVIRONMENT=production. Set a real value in .env.
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-this-is-not-a-secret-000000}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [backend]

  tests:
    profiles: ["test"]                                    # not started by a plain `up`
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/taskflow_test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/taskflow_test
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
